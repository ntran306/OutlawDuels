name: ios

# PLAN.md §2.1. Step 0b: Core tests in the cloud. The ios-ipa job is added in step 0c.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    # Official Swift image, matching the Swift 6.3.3 inside Xcode 26.6 (§2).
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test --package-path Core

  # Records the Xcode and Swift versions on the build runner (§2, U) and runs the
  # Core tests under that Swift, so a language feature it rejects fails here.
  xcode-swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and Swift versions
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode
      - name: Core tests under Xcode's Swift
        run: swift test --package-path Core

  # Unsigned .ipa for Sideloadly (§2.1). No package cache yet: there is no remote
  # package to cache until MediaPipe arrives in step 0f.
  ios-ipa:
    needs: [core-tests, xcode-swift]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OutlawDuels.xcodeproj \
            -scheme OutlawDuels \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OutlawDuels.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/OutlawDuels.xcarchive/Products/Applications/OutlawDuels.app build/ipa/Payload/
          cd build/ipa
          zip -qry OutlawDuels.ipa Payload
          ls -lh OutlawDuels.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OutlawDuels-ipa
          path: build/ipa/OutlawDuels.ipa
          retention-days: 7
          if-no-files-found: error
